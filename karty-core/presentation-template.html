<head>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Manrope:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lato:wght@400;700&family=Space+Grotesk:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}.re-card-container{--bg:#fff;--surface:#f9f9fb;--text:#18181b;--text-muted:#64748b;--accent:#09090b;--border:#e2e8f0;--badge-bg:#f1f5f9;--badge-text:#334155;--radius:16px;--font-body:'Plus Jakarta Sans',sans-serif;--font-heading:'Playfair Display',serif;background:var(--bg);color:var(--text);font-family:var(--font-body);line-height:1.6;max-width:1100px;margin:0 auto;padding:24px 16px;overflow:hidden}.theme-light-minimal{--bg:#fff;--surface:#f9f9fb;--text:#18181b;--text-muted:#64748b;--accent:#09090b;--border:#e2e8f0;--badge-bg:#f1f5f9;--badge-text:#334155;--radius:12px;--font-body:'Plus Jakarta Sans',sans-serif;--font-heading:'Playfair Display',serif}.theme-midnight-gold{--bg:#0a0a0d;--surface:#141419;--text:#f8fafc;--text-muted:#94a3b8;--accent:#d4af37;--border:rgba(212,175,55,.22);--badge-bg:rgba(212,175,55,.12);--badge-text:#e2cd7e;--radius:16px;--font-body:'Montserrat',sans-serif;--font-heading:'Cinzel',serif}.theme-riviera-sand{--bg:#f7f5ee;--surface:#edeae0;--text:#2d332f;--text-muted:#687069;--accent:#c86d51;--border:#ddd6c8;--badge-bg:#e6ded0;--badge-text:#4e6553;--radius:24px;--font-body:'Manrope',sans-serif;--font-heading:'Cormorant Garamond',serif}.theme-ocean-blue{--bg:#f0f9ff;--surface:#fff;--text:#0f172a;--text-muted:#64748b;--accent:#0ea5e9;--border:#e0f2fe;--badge-bg:#e0f2fe;--badge-text:#0369a1;--radius:20px;--font-body:'Inter',sans-serif;--font-heading:'Outfit',sans-serif}.theme-emerald-forest{--bg:#f0fdf4;--surface:#fff;--text:#064e3b;--text-muted:#166534;--accent:#10b981;--border:#dcfce7;--badge-bg:#d1fae5;--badge-text:#047857;--radius:16px;--font-body:'Lato',sans-serif;--font-heading:'Playfair Display',serif}.theme-slate-industrial{--bg:#0f172a;--surface:#1e293b;--text:#f8fafc;--text-muted:#94a3b8;--accent:#6366f1;--border:#334155;--badge-bg:rgba(99,102,241,.15);--badge-text:#a5b4fc;--radius:8px;--font-body:'Roboto',sans-serif;--font-heading:'Space Grotesk',sans-serif}
.re-object-nav{display:flex;gap:8px;overflow-x:auto;margin:0 0 20px;padding:2px}.re-object-nav button{border:1px solid var(--border);background:var(--surface);color:var(--text-muted);border-radius:999px;padding:8px 14px;white-space:nowrap;font:600 12px var(--font-body);cursor:pointer}.re-object-nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}.re-object-panel{display:none}.re-object-panel.active{display:block}.re-gallery-box{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--surface);box-shadow:0 12px 36px rgba(0,0,0,.1);margin-bottom:32px}.re-gallery-main{position:relative;width:100%;height:320px}.re-gallery-img{width:100%;height:100%;object-fit:cover;display:none}.re-gallery-img.active{display:block}.re-gallery-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.7) 100%)}.re-gallery-caption{position:absolute;bottom:16px;left:16px;right:16px;color:#fff;z-index:5;display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.re-caption-text{font-size:14px;font-weight:500}.re-gallery-counter{background:rgba(0,0,0,.6);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}.re-gallery-btn{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.85);cursor:pointer;z-index:10;font-size:22px;box-shadow:0 4px 12px rgba(0,0,0,.2)}.re-gallery-prev{left:12px}.re-gallery-next{right:12px}.re-gallery-thumbs{display:flex;gap:8px;padding:12px;background:var(--surface);overflow-x:auto}.re-thumb-item{width:70px;height:50px;border-radius:8px;overflow:hidden;opacity:.6;flex-shrink:0;border:2px solid transparent;cursor:pointer}.re-thumb-item.active{opacity:1;border-color:var(--accent)}.re-thumb-item img{width:100%;height:100%;object-fit:cover}.re-title-price-grid{display:flex;flex-direction:column;gap:20px;margin-bottom:32px;padding-bottom:24px;border-bottom:1px solid var(--border)}.re-type-tag{display:inline-block;background:var(--badge-bg);color:var(--badge-text);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:12px}.re-property-title{font-family:var(--font-heading);font-weight:700;font-size:clamp(24px,4vw,36px);line-height:1.2;color:var(--text);margin:0 0 8px}.re-property-address{font-size:14px;color:var(--text-muted);margin:0}.re-price-card{background:var(--surface);border:1px solid var(--border);padding:16px 20px;border-radius:var(--radius)}.re-price-main{font-family:var(--font-heading);font-size:clamp(28px,3.5vw,36px);font-weight:700;color:var(--accent);line-height:1.1;margin-bottom:4px}.re-price-secondary{font-size:13px;color:var(--text-muted);margin-bottom:8px}.re-yield-badge{display:inline-block;background:rgba(34,197,94,.15);color:#059669;padding:4px 10px;border-radius:6px;font-size:12px;font-weight:600}.re-specs-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:36px}.re-spec-card{background:var(--surface);border:1px solid var(--border);padding:12px 14px;border-radius:12px}.re-spec-card.highlight-card{background:var(--badge-bg);border-color:var(--accent)}.re-spec-label{font-size:11px;text-transform:uppercase;color:var(--text-muted);margin-bottom:4px}.re-spec-value{font-size:14px;font-weight:700;color:var(--text)}.re-section-title{font-family:var(--font-heading);font-size:22px;font-weight:700;margin:0 0 16px;color:var(--text)}.re-description-text p{font-size:15px;line-height:1.7;color:var(--text);margin:0 0 16px}.re-advantages-grid{display:grid;grid-template-columns:1fr;gap:12px;margin:24px 0}.re-advantage-item{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);padding:12px 16px;border-radius:12px}.re-adv-icon-box{width:40px;height:40px;border-radius:10px;background:var(--badge-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}.re-adv-title{font-size:14px;font-weight:600;color:var(--text)}.re-adv-dist{font-size:12px;color:var(--accent);font-weight:600}.re-map{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--surface);margin:28px 0}.re-map img{display:block;width:100%;height:220px;object-fit:cover}.re-map-caption{padding:12px 16px;font-size:13px;color:var(--text-muted)}.re-realtor-footer{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px 20px;margin-top:48px;display:flex;flex-direction:column;gap:20px}.re-realtor-profile{display:flex;align-items:center;gap:16px}.re-realtor-avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--accent)}.re-realtor-agency{font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}.re-realtor-name{font-family:var(--font-heading);font-size:20px;font-weight:700;color:var(--text);margin:2px 0}.re-realtor-role{font-size:13px;color:var(--text-muted)}.re-realtor-phone{font-size:14px;font-weight:600;color:var(--accent);margin-top:4px}.re-realtor-actions{display:flex;flex-direction:column;gap:12px;width:100%}.re-btn-primary,.re-btn-secondary{padding:12px 24px;border-radius:9999px;font-size:14px;font-weight:600;text-decoration:none;text-align:center}.re-btn-primary{background:var(--accent);color:#fff}.re-btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.re-empty{padding:80px 20px;text-align:center;color:var(--text-muted)}
 .top-header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:12px 4px;display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.header-logo{font-family:var(--font-heading);font-weight:700;font-size:15px;letter-spacing:1px;color:var(--text);text-transform:uppercase}.header-realtor{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600}.realtor-thumb{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1.5px solid var(--accent)}.re-map{position:relative}.re-map img{transform-origin:center;transition:transform .2s ease}.re-map-tools{position:absolute;top:12px;right:12px;z-index:3;display:flex;gap:6px}.re-map-tools button{width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text);font-size:20px;line-height:1;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}.re-map-google{display:inline-block;margin-top:6px;color:var(--accent);font-size:12px;font-weight:700;text-decoration:none}
@media (min-width:640px){.re-advantages-grid{grid-template-columns:repeat(2,1fr)}}@media (min-width:768px){.re-card-container{padding:40px 32px}.re-gallery-main{height:480px}.re-title-price-grid{flex-direction:row;justify-content:space-between;align-items:center}.re-price-card{text-align:right;min-width:250px}.re-realtor-footer{flex-direction:row;justify-content:space-between;align-items:center;padding:32px}.re-realtor-actions{flex-direction:row;width:auto}}@media (min-width:1024px){.re-advantages-grid{grid-template-columns:repeat(3,1fr)}}
</style>
<style>.re-map img{height:360px}</style>
<style>.re-status-line{display:block;margin:-4px 0 14px;color:var(--accent);font-size:13px;font-weight:700}.re-project-intro{margin:0 0 30px;padding:24px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}.re-project-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:700}.re-project-title{font-family:var(--font-heading);font-size:24px;color:var(--text);margin:5px 0}.re-project-yield{font-size:18px;font-weight:700;color:var(--accent);margin-bottom:14px}.re-project-highlights{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;list-style:none;margin:0;padding:0}.re-project-highlights li{padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg);font-size:13px;font-weight:600}.re-location-eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700;margin-top:36px;margin-bottom:8px}</style>
</head>
<body>
<div id="root" class="re-card-container __THEME_CLASS__"></div>
<script>
const DATA=__PRESENTATION_JSON__;
const root=document.getElementById('root');
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const attr=esc;
const wa=value=>{const raw=String(value||'').trim();if(!raw)return '';return raw.startsWith('http')?raw:'https://wa.me/'+raw.replace(/\D/g,'')};
const textParts=value=>String(value||'').split(/\n+/).map(x=>x.trim()).filter(Boolean);
function gallery(o,index){const photos=(o.photos||[]).filter(Boolean);if(!photos.length)return '<div class="re-empty">Фотографии объекта не добавлены</div>';const imgs=photos.map((p,i)=>`<img src="${attr(p.url||p)}" alt="${attr(p.caption||o.title)}" class="re-gallery-img ${i===0?'active':''}" data-photo="${i}">`).join('');const thumbs=photos.map((p,i)=>`<div class="re-thumb-item ${i===0?'active':''}" data-thumb="${i}"><img src="${attr(p.url||p)}" alt="thumb"></div>`).join('');return `<div class="re-gallery-box" data-gallery="${index}"><div class="re-gallery-main">${imgs}<div class="re-gallery-overlay"></div><div class="re-gallery-caption"><span class="re-caption-text">${attr(photos[0].caption||o.title||'Объект')}</span><span class="re-gallery-counter">1 / ${photos.length}</span></div><button class="re-gallery-btn re-gallery-prev" data-prev>‹</button><button class="re-gallery-btn re-gallery-next" data-next>›</button></div><div class="re-gallery-thumbs">${thumbs}</div></div>`}
function specs(o){const base=[['Общая площадь',o.area?o.area+' м²':''],['Количество комнат',o.rooms||''],['Спальни',o.bedrooms||''],['Санузлы',o.bathrooms||''],['Этаж',o.floor||''],['Год постройки',o.year||'']];const extra=Array.isArray(o.key_specs)?o.key_specs.map(x=>[x.label,x.value]):[];const canonical=label=>{const s=String(label||'').toLowerCase();if(/площад/.test(s))return'area';if(/комнат/.test(s))return'rooms';if(/спал/.test(s))return'bedrooms';if(/сануз|ванн/.test(s))return'bathrooms';if(/этаж/.test(s))return'floor';if(/год/.test(s))return'year';if(/балкон/.test(s))return'balcony';if(/террас/.test(s))return'terrace';return s};const seen=new Set();const items=[...base,...extra].filter(x=>x[1]).filter(x=>{const key=canonical(x[0]);if(seen.has(key))return false;seen.add(key);return true}).slice(0,10);return items.map((x,i)=>`<div class="re-spec-card ${i===0?'highlight-card':''}"><div class="re-spec-label">${esc(x[0])}</div><div class="re-spec-value">${esc(x[1])}</div></div>`).join('')}
function objectPanel(o,index){const paragraphs=textParts(o.description);const location=o.location_description||o.location_summary||'';const advantages=(o.location_advantages||[]).map(a=>typeof a==='string'?{title:a,distance:'',subtitle:''}:a);const propertyAdvantages=(o.features||[]).map(a=>`<div class="re-advantage-item"><div class="re-adv-icon-box">✓</div><div><div class="re-adv-title">${esc(a)}</div><div class="re-adv-dist">Особенность объекта</div></div></div>`).join('');const locationAdvantages=advantages.map(a=>`<div class="re-advantage-item"><div class="re-adv-icon-box">✓</div><div><div class="re-adv-title">${esc(a.title||a.name)}</div><div class="re-adv-dist">${esc([a.distance,a.subtitle].filter(Boolean).join(' — '))}</div></div></div>`).join('');const price=o.price||'Цена по запросу';const secondary=[o.priceGel&&`${o.priceGel} GEL`,o.pricePerSqm&&`$${o.pricePerSqm} / м²`].filter(Boolean).join(' • ');return `<article class="re-object-panel ${index===0?'active':''}" data-panel="${index}">${gallery(o,index)}<div class="re-title-price-grid"><div class="re-title-col"><span class="re-type-tag">${esc(o.type||o.status||'Недвижимость')}</span><h1 class="re-property-title">${esc(o.title||'Объект недвижимости')}</h1><p class="re-property-address">📍 ${esc([o.city,o.district,o.address].filter(Boolean).join(', '))}</p></div><div class="re-price-card"><div class="re-price-main">${esc(price)}</div><div class="re-price-secondary">${esc(secondary)}</div>${o.yieldPercent?`<span class="re-yield-badge">🔥 ${esc(o.yieldPercent)}</span>`:''}</div></div><div class="re-specs-grid">${specs(o)}</div><h2 class="re-section-title">О резиденции</h2><div class="re-description-text">${(paragraphs.length?paragraphs:['Описание объекта уточняется.']).map(p=>`<p>${esc(p)}</p>`).join('')}</div>${propertyAdvantages?`<div class="re-advantages-grid">${propertyAdvantages}</div>`:''}<h2 class="re-section-title" style="margin-top:36px">О локации${o.location_title?' • '+esc(o.location_title):''}</h2><div class="re-description-text"><p>${esc(location||'Описание локации уточняется.')}</p></div>${locationAdvantages?`<div class="re-advantages-grid">${locationAdvantages}</div>`:''}${o.mapImage?`<div class="re-map"><img src="${attr(o.mapImage)}" alt="Карта расположения"><div class="re-map-caption">📍 ${esc([o.city,o.district,o.address].filter(Boolean).join(', '))}</div></div>`:''}</article>`}
function footer(){const b=DATA.brand||{};const whatsapp=wa(b.whatsapp);return `<footer class="re-realtor-footer"><div class="re-realtor-profile">${b.avatar?`<img src="${attr(b.avatar)}" alt="${attr(b.name)}" class="re-realtor-avatar">`:''}<div><div class="re-realtor-agency">${esc(b.agency)}</div><div class="re-realtor-name">${esc(b.name||'Риэлтор')}</div><div class="re-realtor-role">${esc(b.title||'')}</div><div class="re-realtor-phone">${esc(b.phone||'')}</div></div></div><div class="re-realtor-actions">${b.phone?`<a href="tel:${attr(b.phone)}" class="re-btn-primary">📞 Позвонить</a>`:''}${whatsapp?`<a href="${attr(whatsapp)}" target="_blank" rel="noopener" class="re-btn-secondary">💬 WhatsApp</a>`:''}</div></footer>`}
function enhancePanel(panel,o){const tag=panel.querySelector('.re-type-tag');if(tag&&o.status_line){const status=document.createElement('span');status.className='re-status-line';status.textContent=o.status_line;tag.insertAdjacentElement('afterend',status)}const firstTitle=panel.querySelector('.re-section-title');if(firstTitle){firstTitle.textContent='О резиденции и интерьере';if(o.project_label||o.project_subtitle||(o.highlights||[]).length){const box=document.createElement('div');box.className='re-project-intro';const highlights=(o.highlights||[]).map(item=>`<li>${esc(typeof item==='string'?item:item.text||item.title||'')}</li>`).join('');box.innerHTML=`<div class="re-project-kicker">${esc(o.project_label||'The Residence')}</div><div class="re-project-title">${esc(o.project_subtitle||'Архитектура & Инвестиционный Потенциал')}</div>${o.yield_percent?`<div class="re-project-yield">${esc(o.yield_percent)} в год</div>`:''}${highlights?`<ul class="re-project-highlights">${highlights}</ul>`:''}`;firstTitle.parentNode.insertBefore(box,firstTitle)}}const titles=panel.querySelectorAll('.re-section-title');if(titles.length>1){const eyebrow=document.createElement('div');eyebrow.className='re-location-eyebrow';eyebrow.textContent='Location Benefits';titles[titles.length-1].parentNode.insertBefore(eyebrow,titles[titles.length-1])}}
function render(){if(DATA.expiresAt&&Date.now()>=new Date(DATA.expiresAt).getTime()){root.innerHTML='<div class="re-empty"><h1>Ссылка больше не активна</h1><p>Срок действия подборки недвижимости истёк.</p></div>';return}const objects=(DATA.objects||[]).map(o=>({...o,type:o.type||o.property_type||o.status,priceGel:o.priceGel||o.price_gel,pricePerSqm:o.pricePerSqm||o.price_per_sqm,yieldPercent:o.yieldPercent||o.yield_percent,key_specs:o.key_specs||[]}));const b=DATA.brand||{};const header=`<header class="top-header"><div class="header-logo">${esc(b.agency||DATA.name||'Real Estate')}</div><div class="header-realtor">${b.avatar?`<img src="${attr(b.avatar)}" alt="${attr(b.name)}" class="realtor-thumb">`:''}<span>${esc(b.name||'')}</span></div></header>`;const nav=objects.length>1?`<nav class="re-object-nav">${objects.map((o,i)=>`<button class="${i===0?'active':''}" data-tab="${i}">${i+1}. ${esc(o.title||'Объект')}</button>`).join('')}</nav>`:'';root.innerHTML=`${header}${nav}<div class="re-panels">${objects.length?objects.map(objectPanel).join(''):'<div class="re-empty">Объекты не выбраны</div>'}</div>${objects.length?footer():''}`;objects.forEach((object,index)=>enhancePanel(document.querySelector(`[data-panel="${index}"]`),object));bind();}
function selectPanel(index){document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==index));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel==index));window.scrollTo({top:0,behavior:'smooth'})}
function selectPhoto(gallery,index){const imgs=gallery.querySelectorAll('.re-gallery-img'),thumbs=gallery.querySelectorAll('.re-thumb-item');if(!imgs.length)return;index=(index+imgs.length)%imgs.length;imgs.forEach((x,i)=>x.classList.toggle('active',i===index));thumbs.forEach((x,i)=>x.classList.toggle('active',i===index));gallery.querySelector('.re-gallery-counter').textContent=`${index+1} / ${imgs.length}`;gallery.querySelector('.re-caption-text').textContent=imgs[index].alt}
function bindMaps(){document.querySelectorAll('.re-map').forEach(map=>{if(map.dataset.bound)return;map.dataset.bound='1';const img=map.querySelector('img');if(!img)return;let zoom=1;const tools=document.createElement('div');tools.className='re-map-tools';tools.innerHTML='<button type="button" data-map-zoom="out">−</button><button type="button" data-map-zoom="in">+</button>';map.appendChild(tools);const mapData=(DATA.objects||[])[Array.from(document.querySelectorAll('.re-map')).indexOf(map)]||{};const lat=map.dataset.lat||mapData.map_lat,lng=map.dataset.lng||mapData.map_lng;if(lat&&lng){const link=document.createElement('a');link.className='re-map-google';link.href=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(lat+','+lng)}`;link.target='_blank';link.rel='noopener';link.textContent='Открыть в Google Maps';map.querySelector('.re-map-caption')?.appendChild(link)}tools.querySelector('[data-map-zoom="in"]').onclick=()=>{zoom=Math.min(2.5,zoom+.25);img.style.transform=`scale(${zoom})`};tools.querySelector('[data-map-zoom="out"]').onclick=()=>{zoom=Math.max(1,zoom-.25);img.style.transform=`scale(${zoom})`}})}
function bind(){document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>selectPanel(Number(x.dataset.tab)));document.querySelectorAll('[data-gallery]').forEach(g=>{let current=0;g.querySelector('[data-prev]').onclick=()=>selectPhoto(g,--current);g.querySelector('[data-next]').onclick=()=>selectPhoto(g,++current);g.querySelectorAll('[data-thumb]').forEach(x=>x.onclick=()=>{current=Number(x.dataset.thumb);selectPhoto(g,current)});let start=0;g.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});g.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-start;if(Math.abs(delta)>40){current+=delta<0?1:-1;selectPhoto(g,current)}},{passive:true})});bindMaps()}
render();
</script>
</body>
</html>
